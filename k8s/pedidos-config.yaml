apiVersion: v1
kind: ConfigMap
metadata:
  name: pedidos-config
  labels:
    app: pedidos
data:
  NODE_ENV: "production"
  DB_HOST: "postgres-service"
  DB_NAME: "lojaveloz"
  RABBITMQ_URL: "amqp://rabbitmq-service"
---
apiVersion: v1
kind: Secret
metadata:
  name: pedidos-secret
  labels:
    app: pedidos
type: Opaque
data:
  # Valores em base64 (ex: echo -n "admin" | base64)
  DB_USER: YWRtaW4= 
  DB_PASS: YWRtaW5wYXNzd29yZA==
